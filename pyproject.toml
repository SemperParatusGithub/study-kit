[project]
name = "studykit"
version = "0.1.0"
description = "Course content tooling behind the study-kit agents, skills and website"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "control>=0.10.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5",
    "schemdraw>=0.23",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[project.scripts]
studykit = "studykit.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.uv]
# Only resolve releases that have been public for a week (supply-chain cooldown).
exclude-newer = "7 days"
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests/py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
addopts = "-ra"
