<!doctype html>
<html lang="de">
<head>
<!--#include partials/head.html-->
<title>Quiz hub harness</title>
</head>
<body data-course="mini" data-exam-date="2027-02-15">
<!--#include partials/header.html-->
<main>
<h1>Several quizzes on one page</h1>
<p>Like the MC hub (one quiz per mode, each named by the page) and a chapter's "Test
yourself" (data-n).</p>
<details id="practice" open>
  <summary>Practice</summary>
  <sk-quiz id="quiz-practice" data-course="mini" data-mode="practice" data-n="2" data-intro="false"
    data-pools='["/fixtures/pools/rc-tiefpass.json", "/fixtures/pools/rc-filter.json"]'
    data-topic-titles='{"rc-tiefpass": "RC-Tiefpass", "rc-filter": "RC-Filter und Bode-Diagramm"}'
    data-summary-base="/c/mini/summary/"></sk-quiz>
</details>
<details id="test" open>
  <summary>Test</summary>
  <sk-quiz id="quiz-test" data-course="mini" data-mode="test" data-intro="false"
    data-pools='["/fixtures/pools/rc-tiefpass.json", "/fixtures/pools/rc-filter.json"]'
    data-topic-titles='{"rc-tiefpass": "RC-Tiefpass", "rc-filter": "RC-Filter und Bode-Diagramm"}'
    data-summary-base="/c/mini/summary/"></sk-quiz>
</details>
<details id="mistakes" open>
  <summary>Mistakes</summary>
  <sk-quiz id="quiz-mistakes" data-course="mini" data-mode="mistakes" data-intro="false"
    data-pools='["/fixtures/pools/rc-tiefpass.json", "/fixtures/pools/rc-filter.json"]'
    data-topic-titles='{"rc-tiefpass": "RC-Tiefpass", "rc-filter": "RC-Filter und Bode-Diagramm"}'
    data-summary-base="/c/mini/summary/"></sk-quiz>
</details>
</main>
</body>
</html>
