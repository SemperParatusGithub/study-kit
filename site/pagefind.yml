# Pagefind settings (docs/architecture.md §3.5). `pagefind --site dist` reads this file from
# site/; scripts/pagefind.mjs adds --force-language so all courses share one index.
# Only elements with data-pagefind-body are indexed; never index solutions, hints (a
# running mock exam keeps them locked) or MC keys.
exclude_selectors:
  - ".katex"
  - "sk-mc [data-correct]"
  - "sk-mc .sk-why"
  - "sk-mc .sk-explanation"
  - ".sk-solution"
  - ".sk-hint"
  - ".sk-error-card"
