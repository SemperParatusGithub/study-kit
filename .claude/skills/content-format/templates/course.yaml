# yaml-language-server: $schema=../../schemas/course.schema.json
# course.yaml: the course id is the directory name. No LaTeX anywhere in this file, no
# double-quoted scalars; single-quote values with a backslash or a colon.
schema: 1
id: sample-course
title: Grundlagen RC-Netzwerke (Beispielkurs)
short: RC-Netze
lang: de                        # language of generated content: de | en
semester: WS 2026/27
status: ready                   # draft | ready (ready only when validate --release is green)
exam:
  date: 2027-02-15              # null = unknown: the plan uses a placeholder
  duration_min: 120
  points: 100
  format: mixed                 # written | mc | oral | mixed
  aids: ['Nicht programmierbarer Taschenrechner', 'Selbst geschriebenes Formelblatt (zwei Seiten)']
  mc:
    present: true
    types: [single, multi, kprim]
    scoring: all-or-nothing     # all-or-nothing | partial | kprim
    negative_marking: false
cheatsheet: {allowed: true, max_pages: 2}    # max_pages 1-3
study: {start: 2026-11-02, hours_per_week: 6, blocked: ['2026-12-21..2027-01-06']}
topics:                         # the only topic ids; order = teaching order; prereq acyclic
  - {id: spannungsteiler, title: Spannungsteiler und Ersatzquellen, weight: 0.25, prereq: []}
  - {id: wechselstrom, title: Komplexe Wechselstromrechnung, weight: 0.35, prereq: [spannungsteiler]}
  - {id: rc-filter, title: RC-Filter und Bode-Diagramm, weight: 0.40, prereq: [spannungsteiler, wechselstrom]}
focus: [rc-filter]
skip: []
targets: {exercises_per_topic: auto, mc_per_topic: auto, mock_exams: 1}
retired_ids: []                 # ids of deleted items; never reuse them
