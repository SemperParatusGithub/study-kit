# yaml-language-server: $schema=../../../schemas/notation.schema.json
# Notation of the lecture material, which every author follows. A rule the material does
# not show stays out (the authors then use the content-format defaults).
schema: 1
imaginary_unit: j
phasor: underline
phasor_magnitude: rms
step: epsilon
decimal: comma
symbols:
  - {symbol: '$U_\mathrm{e}$', meaning: Eingangsspannung}
  - {symbol: '$U_\mathrm{a}$', meaning: Ausgangsspannung}
  - {symbol: '$V$', meaning: Spannungsverstärkung (nicht in dB)}
  - {symbol: '$\underline{Z}$', meaning: komplexe Impedanz}
  - {symbol: '$\varepsilon(t)$', meaning: Einheitssprung}
notes:
  - 'Indices in upright type: $U_\mathrm{e}$, $f_\mathrm{g}$; component indices plain: $R_1$, $C_2$.'
  - 'Time-dependent quantities lower case ($u(t)$, $i(t)$), constants and phasors upper case.'
