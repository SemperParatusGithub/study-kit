name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly, catches upstream breakage early

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.11.30"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.22.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.17.0"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Cache pinned tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/downloads
          key: tools-${{ hashFiles('toolchain.toml') }}

      - name: Bootstrap pinned tools
        run: uv run --frozen studykit tools install

      - name: Setup
        run: .tools/bin/just setup

      - name: Lint
        run: .tools/bin/just lint-code

      - name: Test
        run: .tools/bin/just test
