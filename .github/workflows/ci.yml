name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly, catches upstream breakage early

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.11.30"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.22.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.17.0"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Cache pinned tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/downloads
          key: tools-${{ hashFiles('toolchain.toml') }}

      - name: Bootstrap pinned tools
        run: uv run --frozen studykit tools install

      - name: Setup
        run: .tools/bin/just setup

      - name: Lint
        run: .tools/bin/just lint-code

      - name: Install Playwright Chromium
        id: browsers
        run: pnpm -C site exec playwright install --with-deps chromium

      # doctor, the tests (`just test`), a strict build of the sample course into site/dist
      # and its release validation
      - name: CI checks
        id: checks
        run: .tools/bin/just ci

      # The two browser suites run even after an earlier failure, so one failure does not
      # hide the other: the harness needs only Chromium, the e2e suite also the site/dist
      # that `just ci` built.
      - name: Element harness
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm -C site run test:elements

      - name: End-to-end tests
        if: ${{ !cancelled() && steps.checks.outcome == 'success' }}
        run: .tools/bin/just e2e

      - name: Upload the built site
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the Playwright reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            site/node_modules/.cache/sk-e2e/
            site/node_modules/.cache/sk-elements/results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
